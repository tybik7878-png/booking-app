<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись на услугу</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
            margin: 0;
        }
        h2 { margin-top: 0; }
        .block { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
        }
        .slots {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .slot-btn {
            padding: 10px;
            border: 1px solid #007bff;
            border-radius: 8px;
            background: transparent;
            color: #007bff;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .slot-btn.selected {
            background: #007bff;
            color: #fff;
        }
        .slot-btn.disabled {
            border-color: #ccc;
            color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h2>📅 Онлайн-запись</h2>

    <!-- Выбор услуги -->
    <div class="block">
        <label for="service">Выберите услугу:</label>
        <select id="service">
            <option value="Мужская стрижка — 5000 ₸">Мужская стрижка (5000 ₸)</option>
            <option value="Оформление бороды — 3000 ₸">Оформление бороды (3000 ₸)</option>
            <option value="Комплекс (Стрижка + Борода) — 7000 ₸">Комплекс (7000 ₸)</option>
        </select>
    </div>

    <!-- Выбор даты -->
    <div class="block">
        <label for="date">Дата:</label>
        <input type="date" id="date">
    </div>

    <!-- Выбор времени -->
    <div class="block">
        <label>Свободное время:</label>
        <div class="slots" id="slots-container">
            <button class="slot-btn" onclick="selectSlot(this)">10:00</button>
            <button class="slot-btn" onclick="selectSlot(this)">11:30</button>
            <button class="slot-btn" onclick="selectSlot(this)">13:00</button>
            <button class="slot-btn" onclick="selectSlot(this)">14:30</button>
            <button class="slot-btn" onclick="selectSlot(this)">16:00</button>
            <button class="slot-btn" onclick="selectSlot(this)">17:30</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // По умолчанию ставим сегодняшнюю дату
        document.getElementById('date').valueAsDate = new Date();

        let selectedTime = null;

        function selectSlot(btn) {
            if (btn.classList.contains('disabled')) return;
            
            document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedTime = btn.innerText;

            // Показываем главную кнопку Telegram
            tg.MainButton.text = "ПОДТВЕРДИТЬ ЗАПИСЬ";
            tg.MainButton.show();
        }

        // Отправка данных в бота при клике на главную кнопку Telegram
        tg.onEvent('mainButtonClicked', function() {
            const service = document.getElementById('service').value;
            const date = document.getElementById('date').value;

            if (!selectedTime) {
                alert("Пожалуйста, выберите время!");
                return;
            }

            const data = {
                service: service,
                date: date,
                time: selectedTime
            };

            tg.sendData(JSON.stringify(data));
        });
    </script>
</body>
</html>
