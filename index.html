<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн Запись</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
    :root {
        --bg-color: var(--tg-theme-bg-color, #17212b);
        --text-color: var(--tg-theme-text-color, #ffffff);
        --button-color: var(--tg-theme-button-color, #3390ec);
        --button-text: #ffffff;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 16px;
        box-sizing: border-box;
    }

    /* Шапка */
    .header-card {
        background: linear-gradient(135deg, #3390ec, #0066cc);
        color: #ffffff;
        padding: 16px;
        border-radius: 16px;
        margin-bottom: 20px;
        box-shadow: 0 4px 12px rgba(51, 144, 236, 0.3);
    }

    .header-card h2 { margin: 0 0 6px 0; font-size: 20px; color: #ffffff; }
    .header-info { font-size: 13px; opacity: 0.95; line-height: 1.4; color: #ffffff; }

    h3 { font-size: 16px; margin: 16px 0 10px 0; }

    /* Карточки услуг */
    .services-grid { display: flex; flex-direction: column; gap: 10px; }
    .service-card {
        background: #242f3d; /* Тёмный аккуратный фон */
        border: 2px solid #2b394a;
        border-radius: 12px;
        padding: 12px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .service-card.selected {
        border-color: #3390ec;
        background-color: rgba(51, 144, 236, 0.2);
    }

    .service-name { font-weight: 600; font-size: 15px; color: #ffffff !important; }
    .service-price { color: #64b5f6 !important; font-weight: bold; font-size: 14px; }

    /* Поле выбора даты */
    input[type="date"] {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #2b394a;
        font-size: 15px;
        box-sizing: border-box;
        background: #242f3d;
        color: #ffffff !important;
        color-scheme: dark;
    }

    /* Сетка времени */
    .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    
    .time-slot {
        background: #242f3d;
        color: #ffffff !important;
        border: 1px solid #2b394a;
        padding: 10px;
        text-align: center;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }

    .time-slot.selected {
        background: #3390ec !important;
        color: #ffffff !important;
        border-color: #3390ec;
    }

    /* Занятый слот */
    .time-slot.disabled {
        background: #1e2731 !important;
        color: #5c6b73 !important;
        border-color: #1a222d;
        cursor: not-allowed;
        text-decoration: line-through;
    }

    .main-btn {
        width: 100%;
        background: #3390ec;
        color: #ffffff;
        border: none;
        padding: 14px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: bold;
        margin-top: 24px;
        cursor: pointer;
    }
</style>
</head>
<body>

    <!-- Инфо-шапка -->
    <div class="header-card">
        <h2>💈 Barber & Studio</h2>
        <div class="header-info">
            📍 г. Актюбинск, ул. Абилкайыр Хана, 42<br>
            🕒 Режим работы: <b>08:00 – 22:00</b> (без выходных)
        </div>
    </div>

    <!-- 1. Выбор услуги -->
    <h3>1. Выберите услугу</h3>
    <div class="services-grid">
        <div class="service-card" onclick="selectService(this, 'Мужская стрижка', 4000)">
            <span class="service-name">✂️ Мужская стрижка</span>
            <span class="service-price">4 000 ₸</span>
        </div>
        <div class="service-card" onclick="selectService(this, 'Оформление бороды', 2500)">
            <span class="service-name">🧔 Оформление бороды</span>
            <span class="service-price">2 500 ₸</span>
        </div>
        <div class="service-card" onclick="selectService(this, 'Комплекс (Стрижка + Борода)', 6000)">
            <span class="service-name">🔥 Комплекс (Стрижка + Борода)</span>
            <span class="service-price">6 000 ₸</span>
        </div>
    </div>

    <!-- 2. Выбор даты -->
    <h3>2. Выберите дату</h3>
    <input type="date" id="booking-date" onchange="onDateChange()">

    <!-- 3. Выбор времени -->
    <h3>3. Доступное время</h3>
    <div class="time-grid" id="time-grid">
        <!-- Заполняется динамически -->
    </div>

    <button class="main-btn" onclick="submitBooking()">Подтвердить запись</button>

    <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const JSON_URL = 'https://api.jsonstorage.net/v1/json/D9991C5A-3EFE-4C97-9238-E45396D5CF21'; 

    let selectedServiceData = null;
    let selectedTime = null;
    let currentBookings = {};

    const availableTimes = ["09:00", "10:00", "11:30", "13:00", "14:00", "15:30", "16:30", "18:00", "19:30"];

    const dateInput = document.getElementById('booking-date');
    if (!dateInput.value) {
        dateInput.valueAsDate = new Date();
    }

    // 1. Читаем занятые слоты
    async function fetchBookedSlots() {
        try {
            const response = await fetch(JSON_URL);
            currentBookings = await response.json();
            renderTimeSlots();
        } catch (error) {
            console.error('Ошибка загрузки слотов:', error);
            renderTimeSlots();
        }
    }

    // 2. Сохраняем новую бронь
    async function saveBookedSlot(dateStr, timeStr) {
        if (!currentBookings[dateStr]) {
            currentBookings[dateStr] = [];
        }
        if (!currentBookings[dateStr].includes(timeStr)) {
            currentBookings[dateStr].push(timeStr);
        }

        try {
            await fetch(JSON_URL, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(currentBookings)
            });
        } catch (error) {
            console.error('Ошибка сохранения:', error);
        }
    }

    function renderTimeSlots() {
        const grid = document.getElementById('time-grid');
        grid.innerHTML = '';
        
        const currentDate = dateInput.value;
        const bookedSlots = currentBookings[currentDate] || [];

        selectedTime = null;

        availableTimes.forEach(time => {
            const btn = document.createElement('div');
            btn.className = 'time-slot';
            btn.innerText = time;

            if (bookedSlots.includes(time)) {
                btn.classList.add('disabled');
                btn.innerText += " (занято)";
            } else {
                btn.onclick = () => selectTime(btn, time);
            }

            grid.appendChild(btn);
        });
    }

    function selectService(element, name, price) {
        document.querySelectorAll('.service-card').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
        selectedServiceData = { name, price };
    }

    function selectTime(element, time) {
        document.querySelectorAll('.time-slot').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
        selectedTime = time;
    }

    function onDateChange() {
        renderTimeSlots();
    }

    function submitBooking() {
        const date = dateInput.value;

        if (!selectedServiceData) {
            alert("Пожалуйста, выберите услугу!");
            return;
        }
        if (!selectedTime) {
            alert("Пожалуйста, выберите свободное время!");
            return;
        }

        const data = {
            service: `${selectedServiceData.name} (${selectedServiceData.price} ₸)`,
            date: date,
            time: selectedTime
        };

        // Отправляем данные боту — он сам всё сохранит в базу!
        tg.sendData(JSON.stringify(data));
    }
    

    fetchBookedSlots();
    </script>
</body>
</html>
